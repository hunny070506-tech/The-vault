<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="color-scheme" content="dark" />
  <title>THE VAULT | Cinema Reviews & Curated Archive</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vault: {
              red: '#CD1818',
              redLight: '#E52525',
              redHover: '#A81212',
              cream: '#F4F3EF',
              dark: '#09090B',
              surface: '#111115',
              card: '#16161C',
              border: '#25252E',
              muted: '#8E8E9A',
              imdb: '#F5C518'
            }
          },
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      background-color: #09090B !important;
      color: #F4F3EF !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .hero-glow {
      background: linear-gradient(180deg, rgba(205, 24, 24, 0.14) 0%, rgba(9, 9, 11, 0) 100%);
    }
    .poster-aspect {
      aspect-ratio: 2 / 3;
    }
    .movie-card {
      transition: transform 0.2s ease, border-color 0.2s ease;
      will-change: transform;
    }
    @media (hover: hover) {
      .movie-card:hover {
        transform: translateY(-4px);
        border-color: #CD1818;
      }
    }
    .vault-icon-active {
      filter: drop-shadow(0 0 6px rgba(205, 24, 24, 0.65));
    }
    .vault-icon-inactive {
      opacity: 0.24;
      filter: grayscale(100%);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090B; }
    ::-webkit-scrollbar-thumb { background: #25252E; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #CD1818; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-vault-red selection:text-white">

  <!-- ================= STICKY HEADER ================= -->
  <header class="sticky top-0 z-40 bg-vault-dark/95 backdrop-blur-md border-b border-vault-border">
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-2.5 sm:py-3">
      <div class="flex items-center justify-between gap-3">
        
        <!-- Logo & Brand -->
        <a href="#" onclick="resetFilters(); return false;" class="flex items-center gap-2.5 shrink-0 group">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-vault-red flex items-center justify-center overflow-hidden border border-vault-cream/25 shadow-md shrink-0">
            <img src="logo.jpg" alt="The Vault" class="w-full h-full object-cover"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <span class="hidden font-display font-black text-vault-cream text-[9px] tracking-tighter text-center leading-none">THE<br>VAULT</span>
          </div>
          <div>
            <div class="font-display font-black text-lg sm:text-2xl tracking-tight text-vault-cream leading-none">
              THE <span class="text-vault-red">VAULT</span>
            </div>
            <p class="text-[10px] font-medium uppercase tracking-widest text-vault-muted mt-0.5">5-Vault Cinema Archive</p>
          </div>
        </a>

        <!-- Desktop & Tablet Search -->
        <div class="hidden md:block flex-1 max-w-md mx-4">
          <div class="relative">
            <input id="searchInput" type="text" placeholder="Search movies, cast, director, or mood..."
                   oninput="renderMovies()"
                   class="w-full bg-vault-surface border border-vault-border focus:border-vault-red rounded-xl py-2 pl-9 pr-4 text-xs sm:text-sm text-vault-cream placeholder-vault-muted outline-none transition" />
            <svg class="w-4 h-4 text-vault-muted absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <!-- Navigation Pills & Socials -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <div class="flex items-center bg-vault-surface p-1 rounded-xl border border-vault-border">
            <button onclick="setTypeFilter('all')" id="tab-all" class="px-2.5 sm:px-3.5 py-1 rounded-lg text-xs font-bold bg-vault-red text-white transition">All</button>
            <button onclick="setTypeFilter('Review')" id="tab-Review" class="px-2.5 sm:px-3.5 py-1 rounded-lg text-xs font-semibold text-vault-muted hover:text-vault-cream transition">Reviews</button>
            <button onclick="setTypeFilter('Recommendation')" id="tab-Recommendation" class="px-2.5 sm:px-3.5 py-1 rounded-lg text-xs font-semibold text-vault-muted hover:text-vault-cream transition whitespace-nowrap">Picks</button>
          </div>

          <!-- Social Buttons (Desktop/Tablet) -->
          <div class="hidden lg:flex items-center gap-1.5">
            <a href="https://x.com/TheVaultCertify" target="_blank" rel="noopener noreferrer"
               class="px-3 py-1.5 rounded-xl bg-vault-surface border border-vault-border hover:border-vault-red text-vault-cream text-xs font-bold flex items-center gap-1.5 transition">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              <span>@TheVaultCertify</span>
            </a>
            <a href="https://boxd.it/9MowN" target="_blank" rel="noopener noreferrer"
               class="px-3 py-1.5 rounded-xl bg-vault-surface border border-vault-border hover:border-vault-red text-vault-cream text-xs font-bold flex items-center gap-1.5 transition">
              <span class="flex items-center -space-x-0.5">
                <span class="w-2 h-2 rounded-full bg-[#FF8000]"></span>
                <span class="w-2 h-2 rounded-full bg-[#00E054]"></span>
                <span class="w-2 h-2 rounded-full bg-[#40BCF4]"></span>
              </span>
              <span>Letterboxd</span>
            </a>
          </div>

          <!-- Admin Add Button -->
          <button id="addMovieBtn" onclick="openEditorModal()" class="hidden px-3 py-1.5 rounded-xl text-xs font-bold bg-vault-cream text-vault-dark hover:bg-white transition items-center gap-1 shadow">
            <span>+ Add</span>
          </button>
        </div>
      </div>

      <!-- Mobile Search & Quick Social Bar -->
      <div class="flex items-center gap-2 mt-2.5 md:hidden">
        <div class="relative flex-1">
          <input id="mobileSearchInput" type="text" placeholder="Search title, cast, director..."
                 oninput="document.getElementById('searchInput').value = this.value; renderMovies();"
                 class="w-full bg-vault-surface border border-vault-border focus:border-vault-red rounded-xl py-1.5 pl-8 pr-3 text-xs text-vault-cream placeholder-vault-muted outline-none" />
          <svg class="w-3.5 h-3.5 text-vault-muted absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <a href="https://x.com/TheVaultCertify" target="_blank" rel="noopener noreferrer" aria-label="X"
           class="p-2 rounded-xl bg-vault-surface border border-vault-border text-vault-cream shrink-0">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="https://boxd.it/9MowN" target="_blank" rel="noopener noreferrer" aria-label="Letterboxd"
           class="px-2.5 py-2 rounded-xl bg-vault-surface border border-vault-border flex items-center -space-x-0.5 shrink-0">
          <span class="w-2 h-2 rounded-full bg-[#FF8000]"></span>
          <span class="w-2 h-2 rounded-full bg-[#00E054]"></span>
          <span class="w-2 h-2 rounded-full bg-[#40BCF4]"></span>
        </a>
      </div>
    </div>
  </header>

  <!-- ================= FEATURED SPOTLIGHT ================= -->
  <div class="hero-glow">
    <section id="heroSection" class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 pt-5 pb-3 w-full"></section>
  </div>

  <!-- ================= FILTER BAR ================= -->
  <section class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-3 w-full">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pb-3 border-b border-vault-border">
      
      <!-- Mood Scrollable Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="moodFilterBar">
        <button onclick="setMoodFilter('all')" data-mood="all" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-vault-red text-white">All Moods</button>
        <button onclick="setMoodFilter('Mythological Epic')" data-mood="Mythological Epic" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🏹 Mythological Epic</button>
        <button onclick="setMoodFilter('Investigative Thriller')" data-mood="Investigative Thriller" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🔦 Investigative Thriller</button>
        <button onclick="setMoodFilter('Smart Whodunit')" data-mood="Smart Whodunit" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🕵️ Smart Whodunit</button>
        <button onclick="setMoodFilter('High-Octane Action')" data-mood="High-Octane Action" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🔥 High-Octane Action</button>
        <button onclick="setMoodFilter('Mind-Bender')" data-mood="Mind-Bender" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🌀 Mind-Bender</button>
        <button onclick="setMoodFilter('Comfort & Comedy')" data-mood="Comfort & Comedy" class="mood-btn shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-vault-surface text-vault-muted border border-vault-border hover:text-vault-cream">🍿 Comfort & Comedy</button>
      </div>

      <!-- Dropdown Filters -->
      <div class="flex items-center gap-2 shrink-0">
        <select id="langFilter" onchange="renderMovies()" class="flex-1 sm:flex-initial bg-vault-surface border border-vault-border rounded-lg px-3 py-1.5 text-xs font-semibold text-vault-cream outline-none focus:border-vault-red">
          <option value="all">All Languages</option>
          <option value="Telugu">Telugu</option>
          <option value="Hindi">Hindi</option>
          <option value="Malayalam">Malayalam</option>
          <option value="Tamil">Tamil</option>
          <option value="English">English</option>
          <option value="Pan-India">Pan-India</option>
        </select>

        <select id="tierFilter" onchange="renderMovies()" class="flex-1 sm:flex-initial bg-vault-surface border border-vault-border rounded-lg px-3 py-1.5 text-xs font-semibold text-vault-cream outline-none focus:border-vault-red">
          <option value="all">All Vault Tiers</option>
          <option value="Locked in The Vault">🔒 Locked in The Vault</option>
          <option value="Certified Banger">🔥 Certified Banger</option>
          <option value="One-Time Watch">🍿 One-Time Watch</option>
          <option value="Skip">🚫 Skip</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ================= RESPONSIVE MOVIE GRID ================= -->
  <!-- Phone: 2 cols | Tablet: 3 cols | Desktop: 4 cols -->
  <main class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 flex-1 w-full">
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5 lg:gap-6"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <p class="font-display text-lg font-bold text-vault-cream">No titles match that filter</p>
      <p class="text-xs text-vault-muted mt-1">Reset filters to view all entries in The Vault.</p>
      <button onclick="resetFilters()" class="mt-4 px-4 py-2 rounded-xl bg-vault-red text-white text-xs font-bold">Reset Filters</button>
    </div>
  </main>

  <!-- ================= MOVIE DETAIL MODAL (Phone Bottom-Sheet / Desktop Center) ================= -->
  <div id="detailModal" onclick="if(event.target === this) closeDetailModal()" class="fixed inset-0 z-50 hidden bg-black/80 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="bg-vault-card border-t sm:border border-vault-border rounded-t-3xl sm:rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-y-auto shadow-2xl relative">
      <div id="detailModalContent"></div>
    </div>
  </div>

  <!-- ================= ADMIN ADD / EDIT MODAL ================= -->
  <div id="editorModal" onclick="if(event.target === this) closeEditorModal()" class="fixed inset-0 z-50 hidden bg-black/85 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="bg-vault-card border-t sm:border border-vault-border rounded-t-3xl sm:rounded-2xl max-w-2xl w-full p-5 sm:p-7 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-vault-border mb-4">
        <h2 id="editorTitle" class="font-display text-xl sm:text-2xl font-extrabold text-vault-cream">Add to The Vault</h2>
        <button onclick="closeEditorModal()" class="w-8 h-8 rounded-full bg-vault-surface text-vault-muted hover:text-white flex items-center justify-center text-xl">&times;</button>
      </div>

      <form id="movieForm" onsubmit="saveMovie(event)" class="space-y-3.5">
        <input type="hidden" id="editId" />

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Movie / Series Title *</label>
            <div class="flex gap-2">
              <input id="f_title" required type="text" placeholder="e.g., Ramayana: Part 1" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-cream focus:border-vault-red outline-none" />
              <button type="button" onclick="autoFetchPoster()" id="autoPosterBtn" class="shrink-0 px-3 py-2 rounded-lg bg-vault-red text-white text-xs font-bold">⚡ Poster</button>
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Release Year *</label>
            <input id="f_year" required type="number" placeholder="2026" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-cream focus:border-vault-red outline-none" />
          </div>
        </div>

        <div class="p-3 rounded-xl bg-vault-dark border border-vault-border space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-[11px] font-bold uppercase text-vault-muted">Poster URL or Gallery Upload *</label>
            <label class="cursor-pointer text-xs font-bold text-vault-red hover:underline">
              📱 Upload Image
              <input type="file" accept="image/*" class="hidden" onchange="handlePosterUpload(event)" />
            </label>
          </div>
          <input id="f_poster" required type="text" placeholder="Tap '⚡ Poster', upload from gallery, or paste image link..." class="w-full bg-vault-card border border-vault-border rounded-lg px-3 py-1.5 text-xs text-vault-cream outline-none" />
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Entry Type *</label>
            <select id="f_type" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream">
              <option value="Review">Review</option>
              <option value="Recommendation">Vault Pick</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Language *</label>
            <select id="f_language" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream">
              <option value="Pan-India">Pan-India</option>
              <option value="Telugu">Telugu</option>
              <option value="Hindi">Hindi</option>
              <option value="Malayalam">Malayalam</option>
              <option value="Tamil">Tamil</option>
              <option value="English">English</option>
            </select>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Mood / Genre *</label>
            <select id="f_mood" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream">
              <option value="Mythological Epic">Mythological Epic</option>
              <option value="Investigative Thriller">Investigative Thriller</option>
              <option value="Smart Whodunit">Smart Whodunit</option>
              <option value="High-Octane Action">High-Octane Action</option>
              <option value="Mind-Bender">Mind-Bender</option>
              <option value="Psychological Horror">Psychological Horror</option>
              <option value="Comfort & Comedy">Comfort & Comedy</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Rating (Out of 5) *</label>
            <input id="f_rating" required type="number" step="0.5" min="0.5" max="5" placeholder="3.0" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-cream" />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Category Tier *</label>
            <select id="f_tier" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream">
              <option value="One-Time Watch">🍿 One-Time Watch</option>
              <option value="Locked in The Vault">🔒 Locked in The Vault</option>
              <option value="Certified Banger">🔥 Certified Banger</option>
              <option value="Skip">🚫 Skip</option>
            </select>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Where to Watch</label>
            <input id="f_platform" type="text" placeholder="Theatres / IMAX / Prime Video" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-cream" />
          </div>
        </div>

        <!-- IMDb Synopsis -->
        <div>
          <label class="block text-[11px] font-bold uppercase text-vault-imdb mb-1">IMDb Official Synopsis *</label>
          <textarea id="f_synopsis" required rows="2" placeholder="Official plot premise..." class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream"></textarea>
        </div>

        <!-- Cast & Crew -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Main Cast & Roles *</label>
            <input id="f_cast" required type="text" placeholder="Ranbir Kapoor (Rama), Yash (Ravana), Sai Pallavi (Sita)" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Key Crew (Director, Music, DOP) *</label>
            <input id="f_crew" required type="text" placeholder="Dir: Nitesh Tiwari | Music: Hans Zimmer & A.R. Rahman" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Director</label>
            <input id="f_director" type="text" placeholder="Nitesh Tiwari" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Screenplay / Craft Note</label>
            <input id="f_screenplay" type="text" placeholder="Ravana's psychological arc shines; catalysts rushed" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Sound & Score Note</label>
            <input id="f_bgm" type="text" placeholder="Oscar-tier sound design; underwhelming score" class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">One-Line Verdict *</label>
          <input id="f_verdict" required type="text" placeholder="A visually grand magnum opus anchored by Yash and Oscar-tier sound, held back by a rushed core." class="w-full bg-vault-dark border border-vault-border rounded-lg px-3 py-2 text-xs sm:text-sm text-vault-cream" />
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase text-vault-muted mb-1">Full Review *</label>

    // Fast Cached Poster Fetcher (Runs in parallel and caches in localStorage)
    const posterCache = JSON.parse(localStorage.getItem("vault_poster_cache_v3") || "{}");

    async function fetchWikiPoster(title, year = "") {
      const cacheKey = `${title}_${year}`.toLowerCase();
      if (posterCache[cacheKey]) return posterCache[cacheKey];

      const queries = [
        `${title} ${year} film`,
        `${title} film`,
        title
      ];

      for (const qStr of queries) {
        try {
          const url = `https://en.wikipedia.org/w/api.php?action=query&origin=*&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=600&generator=search&gsrsearch=${encodeURIComponent(qStr)}&gsrlimit=1`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.query && data.query.pages) {
            const page = Object.values(data.query.pages)[0];
            const src = page.thumbnail && page.thumbnail.source;
            if (src) {
              posterCache[cacheKey] = src;
              localStorage.setItem("vault_poster_cache_v3", JSON.stringify(posterCache));
              return src;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    window.autoFetchPoster = async function () {

      const year = document.getElementById("f_year").value.trim();
      if (!title) {

        return;
      }
      const btn = document.getElementById("autoPosterBtn");
      btn.textContent = "...";
      const foundUrl = await fetchWikiPoster(title, year);
      if (foundUrl) {
        document.getElementById("f_poster").value = foundUrl;
        btn.textContent = "✓ Found";
      } else {
        document.getElementById("f_poster").value = window.generateVaultFallbackPoster(title, year);
        btn.textContent = "✓ Vault Art";
      }
      setTimeout(() => { btn.textContent = "⚡ Poster"; }, 1800);
    };

    window.handlePosterUpload = function (event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const maxW = 480;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          document.getElementById("f_poster").value = canvas.toDataURL("image/jpeg", 0.82);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      document.getElementById("dbStatusBadge").textContent = "🟢 Live Vault";

      onAuthStateChanged(auth, (user) => {
        isAdmin = !!(user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
        updateAdminUI();
      });

      const q = query(collection(db, "movies"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const cloudMovies = snapshot.docs.map(d => {
          const data = d.data();
          return {
            ...data,
            id: d.id,
            rating: normalizeRating(data.rating)
          };

          movies = [...DEFAULT_MOVIES];

          movies = [DEFAULT_MOVIES[0], ...cloudMovies];

          movies = cloudMovies;

        renderMovies();
        hydrateAllPostersParallel();

        loadLocalFallback();
      });

      document.getElementById("dbStatusBadge").textContent = "Local Archive";

        movies = [...DEFAULT_MOVIES];

      isAdmin = localStorage.getItem("the_vault_demo_admin") === "true";
      updateAdminUI();
      renderMovies();
      hydrateAllPostersParallel();

    async function hydrateAllPostersParallel() {
      const tasks = movies.map(async (m) => {
        if (!m.poster || m.poster.includes("unsplash.com")) {
          const found = await fetchWikiPoster(m.title, m.year);
          m.poster = found || window.generateVaultFallbackPoster(m.title, m.year);
          return true;
        }
        return false;
      });
      const results = await Promise.all(tasks);
      if (results.some(Boolean)) renderMovies();
    }

        authBtn.textContent = "🔒 Admin";

      renderMovies();

      if (!auth) {
        isAdmin = !isAdmin;
        localStorage.setItem("the_vault_demo_admin", isAdmin);
        updateAdminUI();
        return;
      }
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        const provider = new GoogleAuthProvider();
        try {
          const result = await signInWithPopup(auth, provider);
          if (result.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
            alert("Signed in as " + result.user.email + ", which is not authorized.");
            await signOut(auth);

    // Viewer 5-Vault Rating Helpers
    function getViewerStats(movie) {
      const localVotes = JSON.parse(localStorage.getItem("vault_viewer_votes_v1") || "{}");
      const userVote = localVotes[movie.id] || null;
      const baseSum = Number(movie.viewerRatingSum) || (normalizeRating(movie.rating) * 12);
      const baseCount = Number(movie.viewerRatingCount) || 12;
      const totalSum = userVote ? baseSum + Number(userVote) : baseSum;
      const totalCount = userVote ? baseCount + 1 : baseCount;
      const avg = (totalSum / totalCount).toFixed(1);
      return { avg, count: totalCount, userVote };
    }

      e.preventDefault();

      const titleVal = document.getElementById("f_title").value.trim();
      const yearVal = Number(document.getElementById("f_year").value);
      let posterVal = document.getElementById("f_poster").value.trim();
      if (!posterVal) {
        posterVal = (await fetchWikiPoster(titleVal, yearVal)) || window.generateVaultFallbackPoster(titleVal, yearVal);
      }

      const payload = {
        title: titleVal,
        year: yearVal,
        type: document.getElementById("f_type").value,
        language: document.getElementById("f_language").value,
        mood: document.getElementById("f_mood").value,
        rating: normalizeRating(document.getElementById("f_rating").value),
        tier: document.getElementById("f_tier").value,
        platform: document.getElementById("f_platform").value.trim(),
        synopsis: document.getElementById("f_synopsis").value.trim(),
        cast: document.getElementById("f_cast").value.trim(),
        crew: document.getElementById("f_crew").value.trim(),
        director: document.getElementById("f_director").value.trim(),
        poster: posterVal,
        screenplay: document.getElementById("f_screenplay").value.trim(),
        bgm: document.getElementById("f_bgm").value.trim(),
        verdict: document.getElementById("f_verdict").value.trim(),
        review: document.getElementById("f_review").value.trim(),
        spoilers: document.getElementById("f_spoilers").value.trim(),
        featured: document.getElementById("f_featured").checked,
        createdAt: Date.now()
      };

      if (db && isAdmin) {
        try {
          if (editId && !editId.startsWith("sample-") && editId !== "ramayana-2026") {
            await updateDoc(doc(db, "movies", editId), payload);
          } else {
            await addDoc(collection(db, "movies"), payload);
          }
        } catch (err) {
          alert("Error saving to Firebase: " + err.message);
          return;
        }
      } else {
        if (editId) {
          movies = movies.map(m => m.id === editId ? { ...payload, id: editId } : m);
        } else {
          movies.unshift({ ...payload, id: "local-" + Date.now() });
        }
        localStorage.setItem("the_vault_movies_v5", JSON.stringify(movies));
        renderMovies();
      }

      closeEditorModal();
    };

    window.deleteMovie = async function (id) {
      if (!confirm("Delete this entry from The Vault?")) return;
      if (db && isAdmin && !id.startsWith("sample-") && id !== "ramayana-2026") {
        await deleteDoc(doc(db, "movies", id));
      } else {
        movies = movies.filter(m => m.id !== id);
        localStorage.setItem("the_vault_movies_v5", JSON.stringify(movies));
        renderMovies();
      }
      closeDetailModal();
    };
  </script>
</body>
</html>
